# trial10 config E
merge_queue:
  max_parallel_checks: 5

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 1 min
    checks_timeout: 45 min
    queue_conditions:
      - check-success=CI Gate
    merge_conditions:
      - check-success=CI Gate

priority_rules:
  - name: main repair first
    conditions:
      - head~=^ovn/fix-main
    priority: high

pull_request_rules:
  - name: merge green up-to-date PRs now
    conditions:
      - label=automerge
      - -draft
      - -conflict
      - -label~=^(hold|wip|do-not-merge)$
      - -files~=^(web/|supabase/migrations/|gateway/|\.github/)
      - check-success=CI Gate
    actions:
      merge:
        method: squash
  - name: queue PRs labelled automerge
    conditions:
      - label=automerge
      - -draft
      - -conflict
      - -label~=^(hold|wip|do-not-merge)$
      - files~=^(web/|supabase/migrations/|gateway/|\.github/)
    actions:
      queue:
        name: default
